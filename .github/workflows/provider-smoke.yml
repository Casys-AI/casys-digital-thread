name: Provider Smoke (FEA live)

# Manual trigger only — never on PR or push.
#
# WHY MANUAL — the smoke gate probes SysON read-only, writes one locally named
# ephemeral STEP through build123d, and calls live CalculiX. Triggering it on
# every PR would require live providers in CI (not available). Trigger it after
# a provider image update to validate the provider chain before promotion.
#
# Exit code semantics — the gate is intentionally strict:
#   0 = providers healthy and the FEA pipeline works.
#   1 = providers healthy but the pipeline failed (real regression, block merge).
#   2 = INCONCLUSIVE (one or more providers unavailable) — the workflow maps
#       this to a warning step, not a failure. A missing provider is not a
#       regression; it just means the smoke test could not run.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment label (informational only, no routing)"
        required: false
        default: "local"

permissions:
  contents: read

jobs:
  fea-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Verify committed live provider contract
        run: deno task verify:fea:contract

      - name: Start Docker Compose provider stack
        run: docker compose up -d syson-db syson-app mcp-syson mcp-build123d mcp-calculix
        # Providers may not be available in this CI environment. The smoke gate
        # exits 2 (INCONCLUSIVE) if they are not healthy; the next step handles
        # that exit code as a non-failure.

      - name: Wait for providers to be ready
        run: |
          echo "Waiting up to 120s for providers to become healthy..."
          for i in $(seq 1 24); do
            if curl -sf http://127.0.0.1:3009/health && \
               curl -sf http://127.0.0.1:3014/health && \
               curl -sf http://127.0.0.1:3015/health; then
              echo "All providers healthy."
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Providers not ready after 120s — smoke gate will exit 2 (INCONCLUSIVE)."
        continue-on-error: true

      - name: Run read-only SysON and FEA live smoke gate (couche 3)
        id: smoke
        run: |
          # Capture exit code without relying on set -e behaviour.
          # Exit 0 = pipeline OK. Exit 1 = regression. Exit 2 = INCONCLUSIVE.
          SMOKE_EXIT=0
          deno task verify:fea:live || SMOKE_EXIT=$?
          echo "exit_code=$SMOKE_EXIT" >> "$GITHUB_OUTPUT"

      - name: Evaluate smoke gate result
        env:
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
        run: |
          if [ "$SMOKE_EXIT" = "0" ]; then
            echo "PASS: FEA live smoke gate succeeded."
          elif [ "$SMOKE_EXIT" = "2" ]; then
            echo "WARNING: FEA live smoke gate is INCONCLUSIVE — providers unavailable."
            echo "This is not a regression. Start the provider stack and run manually."
          else
            echo "FAIL: FEA live smoke gate detected a pipeline regression (exit $SMOKE_EXIT)."
            exit 1
          fi

      - name: Stop Docker Compose provider stack
        if: always()
        run: docker compose down
        continue-on-error: true
