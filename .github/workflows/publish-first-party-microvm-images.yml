name: Publish first-party microVM images

on:
  workflow_dispatch:

concurrency:
  group: publish-first-party-microvm-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and emit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      git_sha: ${{ github.sha }}
      git_tag: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Require an exact git tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "This workflow must be invoked on an exact git tag; github.ref_type=${GITHUB_REF_TYPE}." >&2
            exit 1
          fi
          if [ -z "${GITHUB_REF_NAME}" ] || [ -z "${GITHUB_SHA}" ]; then
            echo "Missing git tag name or commit SHA." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Checked-out HEAD $(git rev-parse HEAD) is not github.sha ${GITHUB_SHA}." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "Tag ${GITHUB_REF_NAME} peels to ${tag_commit}, not github.sha ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Export the distribution matrix
        id: export
        run: |
          set -euo pipefail
          deno task release:first-party-microvm-images:matrix > matrix.json
          schema="$(jq -r '.schemaVersion' matrix.json)"
          if [ "${schema}" != "first-party-microsandbox-image-distribution-matrix/1.0" ]; then
            echo "Unexpected distribution matrix schema: ${schema}." >&2
            exit 1
          fi
          count="$(jq '.images | length' matrix.json)"
          if [ "${count}" -lt 1 ]; then
            echo "Distribution matrix emitted no images." >&2
            exit 1
          fi
          if jq -e '.images[] | select(.imageName | test("latest|@|:"))' matrix.json >/dev/null; then
            echo "Distribution matrix contains a mutable or digest publication reference." >&2
            exit 1
          fi
          {
            echo "matrix<<EOF"
            jq -c '{include: [.images[] | {physicalImageId, packageName, imageName, dockerfile, context, platform}]}' matrix.json
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload the planning matrix
        uses: actions/upload-artifact@v4
        with:
          name: first-party-microvm-image-matrix
          path: matrix.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.physicalImageId }}
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_TAG: git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the checked-out commit
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Build jobs require the same exact git tag as prepare." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Build checkout HEAD $(git rev-parse HEAD) is not github.sha ${GITHUB_SHA}." >&2
            exit 1
          fi
          test -f "${DOCKERFILE}"
          test -d "${CONTEXT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ matrix.imageName }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Casys first-party ${{ matrix.physicalImageId }} candidate

      - name: Write the digest receipt
        env:
          PHYSICAL_IMAGE_ID: ${{ matrix.physicalImageId }}
          PACKAGE_NAME: ${{ matrix.packageName }}
          IMAGE_NAME: ${{ matrix.imageName }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          PLATFORM: ${{ matrix.platform }}
          GIT_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST#sha256:}" = "${IMAGE_DIGEST}" ]; then
            echo "Build did not produce a sha256 digest receipt." >&2
            exit 1
          fi
          if [ "${IMAGE_TAG}" = "latest" ]; then
            echo "Candidate publication must not use latest." >&2
            exit 1
          fi
          jq -n \
            --arg physicalImageId "${PHYSICAL_IMAGE_ID}" \
            --arg packageName "${PACKAGE_NAME}" \
            --arg imageName "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg gitSha "${GITHUB_SHA}" \
            --arg gitTag "${GIT_TAG}" \
            --arg dockerfile "${DOCKERFILE}" \
            --arg context "${CONTEXT}" \
            --arg platform "${PLATFORM}" \
            '{
              physicalImageId: $physicalImageId,
              packageName: $packageName,
              imageName: $imageName,
              tag: $tag,
              digest: $digest,
              gitSha: $gitSha,
              gitTag: $gitTag,
              dockerfile: $dockerfile,
              context: $context,
              platform: $platform
            }' > receipt.json
          {
            echo "physicalImageId=${PHYSICAL_IMAGE_ID}"
            echo "image=${IMAGE_NAME}:${IMAGE_TAG}"
            echo "digest=${IMAGE_DIGEST}"
            echo "gitSha=${GITHUB_SHA}"
            echo "gitTag=${GIT_TAG}"
            echo "platform=${PLATFORM}"
          } > receipt.txt
          {
            echo "### ${PHYSICAL_IMAGE_ID}"
            echo
            echo "- image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- digest: \`${IMAGE_DIGEST}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- tag: \`${GIT_TAG}\`"
            echo
            echo "This is a candidate OCI image. It does not change the catalogued Microsandbox runtime digest."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the digest receipt
        uses: actions/upload-artifact@v4
        with:
          name: digest-receipt-${{ matrix.physicalImageId }}
          path: |
            receipt.json
            receipt.txt
          if-no-files-found: error
