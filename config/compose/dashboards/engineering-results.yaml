# mcp-compose runs sources in parallel and only injects caller-supplied args.
# It cannot pass a build123d STEP export into CalculiX, so this dashboard does
# not claim a live CAD -> FEA chain until ordered result-to-argument binding exists.
name: Coffee machine simulation, CAD and BOM evidence
sources:
  - id: coffee-machine-simulation
    manifest: mcp-modelica
    surface:
      layout: { type: grid, columns: 2, gap: sm }
      components:
        - { id: status, component: modelica.execution-status }
        - { id: metrics, component: modelica.metrics }
        - { id: provenance, component: modelica.provenance }
        - { id: artifacts, component: modelica.artifacts }
    calls:
      - tool: modelica_simulate
        args:
          model_id: coffee-machine-v1
          scenario_id: heat-up-nominal
  - id: sample-cad
    manifest: mcp-build123d
    surface:
      layout: { type: stack, gap: sm }
      components:
        - { id: status, component: build123d.geometry-status }
        - { id: metrics, component: build123d.geometry-metrics }
        - { id: canvas, component: build123d.geometry-canvas }
    calls:
      - tool: build123d_execute
        args:
          script: |
            from build123d import Box
            result = Box(10, 20, 5)
  - id: manufacturing-bom
    manifest: mcp-erpnext
    calls:
      - tool: erpnext_bom_list
        args:
          limit: 20
          is_active: true
orchestration:
  layout: grid
