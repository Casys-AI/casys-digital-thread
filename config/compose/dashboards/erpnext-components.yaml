name: ERPNext BOM atomic components
sources:
  - id: manufacturing-bom
    manifest: mcp-erpnext-components
    surface:
      layout: { type: grid, columns: 2, gap: sm }
      components:
        - { id: bom-identity, component: erpnext.bom.identity }
        - { id: bom-metrics, component: erpnext.bom.metrics }
        - { id: bom-materials, component: erpnext.bom.materials }
        - { id: bom-costs, component: erpnext.bom.costs }
    calls:
      - tool: erpnext_bom_surface
        args:
          limit: 10
          is_active: true
          is_default: true
orchestration:
  layout: stack
