# Real linear-static proof for examples/bracket. The STEP file must already exist at
# /exports/bracket.step; generate it with build123d_export as documented in the example.
name: Bracket CalculiX component proof
sources:
  - id: mechanical-proof
    manifest: mcp-calculix
    surface:
      layout: { type: grid, columns: 2, gap: md }
      components:
        - { id: solve-metrics, component: calculix.solve-metrics }
        - { id: mesh-summary, component: calculix.mesh-summary }
        - { id: constraints, component: calculix.constraints }
        - { id: displacement-details, component: calculix.displacement-details }
    calls:
      - tool: calculix_solve_static
        args:
          step_path: /exports/bracket.step
          mesh_size_mm: 3
          material: { e_mpa: 70000, nu: 0.33 }
          selections:
            - name: FIXED
              box: { min: [-31, -21, -3.1], max: [31, 21, -2.4] }
            - name: LOADED
              box: { min: [-31, -21, 49.4], max: [-24, 21, 50.1] }
          fixed: [FIXED]
          loads:
            - { selection: LOADED, force_n: [0, 0, -500] }
orchestration:
  layout: stack
