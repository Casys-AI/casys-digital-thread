; PrusaSlicer FFF profile — CM-01 DripTray print-estimate
; Generic 0.2 mm layer height / 0.4 mm nozzle / PLA
; Every value below is an explicit declared choice; no preset inheritance.
; Reviewed candidate for the print-estimate case.

[print_settings]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
support_material = 0
brim_width = 0
skirts = 0

[filament_settings]
filament_type = PLA
filament_density = 1.24
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 65

[printer_settings]
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
