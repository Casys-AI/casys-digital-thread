# Authoring prototype only. Loading or compiling this file performs no MCP call.
# The caller must resolve the STEP path and digest from a canonical ThreadSnapshot
# and supply one reviewed analysis case. No material, support, load, or limit is
# inferred from the CAD geometry or from a display name.
schemaVersion: "1.0"
kind: thread-workflow
id: generic-static-mechanical-v1
name: Generic static mechanical verification
description: >-
  Consume one canonical STEP, solve one explicitly reviewed
  static analysis case, normalize unit-bearing observations, then evaluate
  only constraints extracted from SysON.

inputs:
  syson_editing_context_id:
    type: string
    description: Editing context containing the reviewed product model.
  syson_mechanical_requirements_element_id:
    type: string
    description: Element whose child ConstraintUsage defines the mechanical limits.
  cad_step_path:
    type: artifact-uri
    description: STEP path resolved from the current canonical build artifact.
  cad_step_sha256:
    type: string
    description: SHA-256 of that exact canonical STEP artifact.
  reviewed_mesh_size_mm:
    type: number
    description: Mesh size from the reviewed analysis case; no workflow default.
  reviewed_material_e_mpa:
    type: number
    description: Young modulus from the reviewed material specification.
  reviewed_material_nu:
    type: number
    description: Poisson ratio from the reviewed material specification.
  reviewed_fixed_box_min:
    type: array
    description: Minimum XYZ coordinates of the reviewed fixed-face box in mm.
  reviewed_fixed_box_max:
    type: array
    description: Maximum XYZ coordinates of the reviewed fixed-face box in mm.
  reviewed_loaded_box_min:
    type: array
    description: Minimum XYZ coordinates of the reviewed loaded-face box in mm.
  reviewed_loaded_box_max:
    type: array
    description: Maximum XYZ coordinates of the reviewed loaded-face box in mm.
  reviewed_load_force_x_n:
    type: number
    description: Reviewed total X force in N.
  reviewed_load_force_y_n:
    type: number
    description: Reviewed total Y force in N.
  reviewed_load_force_z_n:
    type: number
    description: Reviewed total Z force in N.

nodes:
  requirements:
    description: Read the reviewed SysML constraints; an empty result stays explicit.
    server: syson
    tool: syson_constraint_extract
    arguments:
      editing_context_id: "${inputs.syson_editing_context_id}"
      element_id: "${inputs.syson_mechanical_requirements_element_id}"
    outputs:
      constraints:
        select: constraints
        type: array
        minItems: 2
        description: The two reviewed ConstraintUsage ASTs extracted from the model.

  mechanical:
    description: Solve the exact canonical STEP under the reviewed analysis case.
    server: calculix
    tool: calculix_solve_static
    needs: [requirements]
    arguments:
      step_path: "${inputs.cad_step_path}"
      expected_step_sha256: "${inputs.cad_step_sha256}"
      mesh_size_mm: "${inputs.reviewed_mesh_size_mm}"
      material:
        e_mpa: "${inputs.reviewed_material_e_mpa}"
        nu: "${inputs.reviewed_material_nu}"
      selections:
        - name: FIXED
          box:
            min: "${inputs.reviewed_fixed_box_min}"
            max: "${inputs.reviewed_fixed_box_max}"
        - name: LOADED
          box:
            min: "${inputs.reviewed_loaded_box_min}"
            max: "${inputs.reviewed_loaded_box_max}"
      fixed: [FIXED]
      loads:
        - selection: LOADED
          force_n:
            - "${inputs.reviewed_load_force_x_n}"
            - "${inputs.reviewed_load_force_y_n}"
            - "${inputs.reviewed_load_force_z_n}"
    outputs:
      input_step_sha256:
        select: inputArtifact.sha256
        type: string
        description: Digest recomputed from the solver's stable input snapshot.
      max_displacement:
        select: metrics.maxDisplacement
        type: quantity
      max_von_mises:
        select: metrics.maxVonMises
        type: quantity

  observations:
    description: Convert solver outputs into the feature-value map expected by SysON.
    server: digital-thread
    tool: thread_observations_normalize
    arguments:
      observations:
        assembly_max_displacement:
          quantity: "${mechanical.max_displacement}"
          produced_by: mechanical
        assembly_max_von_mises:
          quantity: "${mechanical.max_von_mises}"
          produced_by: mechanical
      artifact_attestations:
        - producer_sha256: "${inputs.cad_step_sha256}"
          consumer_sha256: "${mechanical.input_step_sha256}"
          relation: consumed_exact_artifact
    outputs:
      values:
        select: values
        type: object
      provenance:
        select: provenance
        type: object

  evaluation:
    description: Evaluate model-owned constraints against normalized computed evidence.
    server: syson
    tool: syson_constraint_evaluate
    arguments:
      constraints: "${requirements.constraints}"
      values: "${observations.values}"
    outputs:
      results:
        select: results
        type: array
      summary:
        select: summary
        type: object
      resolved_values:
        select: resolvedValues
        type: object
