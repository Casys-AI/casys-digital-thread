# The full verification chain, one command:
#   docker compose up -d
#
# Services:
#   syson-db / syson-app   SysON (SysML v2 modeler) on http://localhost:8180
#   mcp-syson              MCP over HTTP on http://localhost:3009
#   mcp-build123d          MCP over HTTP on http://localhost:3014
#   mcp-calculix           MCP over HTTP on http://localhost:3015
#
# The MCP servers bind 0.0.0.0 INSIDE their containers (required to be
# reachable through the port mapping); the mapping itself is loopback-only,
# so nothing is exposed beyond this machine.
#
# build123d and calculix share the /exports volume: a STEP exported by
# build123d_export is immediately readable by calculix_solve_static at
# /exports/<name>.step.
#
# For stdio mode (Claude Desktop) you do not need compose at all — see the
# README's MCP configuration section.

services:
  syson-db:
    image: postgres:15
    environment:
      POSTGRES_DB: syson
      POSTGRES_USER: syson
      POSTGRES_PASSWORD: syson
    volumes:
      - syson-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syson -d syson"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [chain]

  syson-app:
    image: "${SYSON_IMAGE:-eclipsesyson/syson:v2026.7.0}"
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://syson-db/syson
      SPRING_DATASOURCE_USERNAME: syson
      SPRING_DATASOURCE_PASSWORD: syson
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      syson-db:
        condition: service_healthy
    networks: [chain]

  mcp-syson:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain:latest}"
    command: ["syson", "--http", "--port=3009", "--hostname=0.0.0.0"]
    environment:
      SYSON_URL: http://syson-app:8080
    ports:
      - "127.0.0.1:3009:3009"
    depends_on: [syson-app]
    networks: [chain]

  mcp-build123d:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain:latest}"
    command: ["build123d", "--http", "--port=3014", "--hostname=0.0.0.0"]
    ports:
      - "127.0.0.1:3014:3014"
    volumes:
      - exports:/exports
    networks: [chain]

  mcp-calculix:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain:latest}"
    command: ["calculix", "--http", "--port=3015", "--hostname=0.0.0.0"]
    ports:
      - "127.0.0.1:3015:3015"
    volumes:
      - exports:/exports
    networks: [chain]

networks:
  chain:

volumes:
  syson-db-data:
  exports:
