# Maintainer diagnostic Compose topology. Not the Digital Thread cold start.
# Ordinary atelier start is Deno (`deno task start` / `dev` / `start:yolo`).
# CapabilityRuntime providers are H1 JIT launch groups (`casys-syson`,
# `casys-build123d-observation`, `casys-build123d-sandbox`, …). Those groups
# cannot adopt these root-project containers; the same loopback ports collide
# if both run. This file is not the atelier start.
#
# Manual probe only, incompatible with simultaneous H1 groups:
#   docker compose up -d syson-db syson-app mcp-syson mcp-build123d mcp-build123d-sandbox
#
# mcp-erpnext is an optional, separate sibling integration. Start it explicitly only
# when its sibling checkout and environment file are available.
#
# Services:
#   syson-db / syson-app   SysON (SysML v2 modeler) on http://localhost:8180
#   mcp-syson              MCP over HTTP on http://localhost:3009
#   mcp-build123d          MCP over HTTP on http://localhost:3014
#   mcp-erpnext            MCP over HTTP on http://localhost:3012
#
# The historical mcp-modelica sidecar on port 3016 is retired. Product
# Modelica runs in the server-owned local microVM.
#
# The MCP servers bind 0.0.0.0 INSIDE their containers (required to be
# reachable through the port mapping); the mapping itself is loopback-only,
# so nothing is exposed beyond this machine.
#
# The optional recorded CalculiX sensitivity provider is deliberately absent
# from this repository Compose topology. It is activated only by the sealed
# `casys-mcp-calculix` capability launch group, with its own private `/inputs`
# and durable run-ledger volumes; it never mounts the shared CAD `/exports`.
#
services:
  syson-db:
    image: "postgres@sha256:926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561"
    environment:
      POSTGRES_DB: syson
      POSTGRES_USER: syson
      POSTGRES_PASSWORD: syson
    volumes:
      - syson-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syson -d syson"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [chain]

  syson-app:
    # Upstream publishes amd64 only. The pinned Casys image repacks the identical
    # jar onto a multi-arch JRE so the app runs natively on Apple Silicon
    # (startup measured 40.6 s emulated vs 14.4 s native). It is the SysON
    # application, not mcp-syson. Set SYSON_IMAGE to use a reviewed alternative
    # or a local rebuild from images/syson-runtime-repack/.
    image: "${SYSON_IMAGE:-ghcr.io/casys-ai/syson@sha256:d372ae26e5d32e5c599fa7c1599d42c73cf9a54e101cfe6f77175f313d7d84e9}"
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://syson-db/syson
      SPRING_DATASOURCE_USERNAME: syson
      SPRING_DATASOURCE_PASSWORD: syson
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
      # Elasticsearch is an experimental, opt-in SysON integration. It is not
      # part of this topology, so do not let its default localhost probe turn
      # the otherwise ready SysON service into a false-negative health state.
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
    depends_on:
      syson-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      # SysON loads its standard libraries at boot; under amd64 emulation this
      # took 217 seconds in the integration check.
      start_period: 240s
    networks: [chain]

  mcp-syson:
    # The dedicated provider owns its own server entrypoint. Keep this distinct
    # from the shared engineering toolchain used by the CAD services.
    image: "${MCP_SYSON_IMAGE:-ghcr.io/casys-ai/mcp-syson@sha256:87eee6e35a636124d5ba6911492a245d69edcdf1ba67575676c22a0e9d7ce65e}"
    # Do not reintroduce the legacy `syson` command token: the dedicated image
    # already starts server.ts, so only valid server arguments belong here.
    command: ["--port=3009", "--hostname=0.0.0.0"]
    environment:
      SYSON_URL: http://syson-app:8080
    ports:
      - "127.0.0.1:3009:3009"
    depends_on:
      syson-app:
        condition: service_healthy
    networks: [chain]

  mcp-build123d:
    # The dedicated provider image owns its ENTRYPOINT and default HTTP CMD.
    # Do not restore the legacy engineering-toolchain `build123d` subcommand.
    image: "${MCP_BUILD123D_IMAGE:-ghcr.io/casys-ai/mcp-build123d@sha256:765d73ca6a15b6112d3693a298514ae4ff1a8ce85485cf5cf4074b41c218142d}"
    ports:
      - "127.0.0.1:3014:3014"
    volumes:
      - exports:/exports
    networks: [chain]
    # WHY QUOTAS HERE AND NOT IN THE SCRIPT VALIDATOR — this is the only
    # provider that executes a geometry program proposed by an agent and signed
    # by a human.  Resource exhaustion is a quantitative bound: a token-level
    # validator cannot express it (a single expression with no loop can still
    # exhaust memory), and enforcing it in the language would cripple the
    # geometry vocabulary.  The container bounds consumption whatever the
    # script does; the validator bounds *reach* (filesystem, imports, I/O).
    # Values are deliberately generous: a real STEP/GLTF export of an assembly
    # is memory-hungry, and a false OOM would look like a product defect.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # WHY A SECOND build123d — this instance executes GEOMETRY PROGRAMS PROPOSED BY
  # AN AGENT (the preview path), while mcp-build123d only ever runs server-fixed
  # recipes rendered from reviewed code. A SHA-256 fingerprint proves the identity
  # of bytes AFTER sealing, not their causal provenance: a write landing in the
  # shared evidence volume before the producer computes its hash would make the
  # wrong hash the expected one, and every downstream consumer would then
  # authenticate the wrong bytes perfectly. So the container that runs proposed
  # programs gets a PRIVATE volume and never touches `exports`. The server lifts
  # its bytes out with `docker compose cp` + fail-closed SHA-256 verification,
  # exactly as it already does for attested assets.
  mcp-build123d-sandbox:
    # Same dedicated provider release, but the private volume and server-owned
    # admission boundary below remain distinct from the canonical service.
    image: "${MCP_BUILD123D_IMAGE:-ghcr.io/casys-ai/mcp-build123d@sha256:765d73ca6a15b6112d3693a298514ae4ff1a8ce85485cf5cf4074b41c218142d}"
    ports:
      - "127.0.0.1:3024:3014"
    volumes:
      - build123d-sandbox-exports:/exports
    networks: [chain]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Until the mcp-server 0.24 base is reviewed and released by mcp-erpnext, the
  # local tag combines base 17ca098 with viewer/UOM fix 1d99467. Build only from
  # that exact clean commit (MCP_ERPNEXT_CONTEXT can select another worktree).
  # The ERP API remains on its own network; only this MCP bridge joins both.
  mcp-erpnext:
    build:
      context: "${MCP_ERPNEXT_CONTEXT:-../mcp-erpnext}"
    image: "${MCP_ERPNEXT_IMAGE:-casys-digital-thread/mcp-erpnext:3.0.0-17ca098-1d99467}"
    command:
      [
        "run",
        "--allow-all",
        "server.ts",
        "--http",
        "--port=3012",
        "--hostname=0.0.0.0",
        "--categories=manufacturing,inventory,operations",
      ]
    env_file:
      - path: "${ERPNEXT_ENV_FILE:-../mcp-erpnext/.env}"
        required: false
    environment:
      # Container DNS is preferable to routing API credentials through a host
      # port. Override only when the ERPNext stack uses another service name.
      ERPNEXT_URL: "${ERPNEXT_UPSTREAM_URL:-http://frontend:8080}"
    ports:
      - "127.0.0.1:3012:3012"
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3012/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain, erpnext]

  # The four standalone engineering-capability servers, each pinned to its published ghcr
  # image. Their entrypoints default to HTTP mode binding 0.0.0.0 inside the
  # container on their park port; the mappings stay loopback-only. dfm,
  # prusaslicer and spice mount /exports read-only. mcp-spice normally consumes a
  # content-addressed submitted netlist; its legacy-path compatibility input may only
  # snapshot an artifact already present here — it never writes into this volume.
  mcp-dfm:
    image: "${MCP_DFM_IMAGE:-ghcr.io/casys-ai/mcp-dfm@sha256:a31aa702e45e4445c67454f807832b60455211664fa98ff36f54948aedec4fb9}"
    ports:
      - "127.0.0.1:3018:3018"
    volumes:
      - exports:/exports:ro
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3018/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  mcp-tolerance:
    image: "${MCP_TOLERANCE_IMAGE:-ghcr.io/casys-ai/mcp-tolerance@sha256:fb84ac18847561c9003d0ca19111fa8ab2afe7e99dfcd325129de279dff01aea}"
    ports:
      - "127.0.0.1:3019:3019"
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3019/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  mcp-prusaslicer:
    image: "${MCP_PRUSASLICER_IMAGE:-ghcr.io/casys-ai/mcp-prusaslicer@sha256:52bb17da9db8fa59e62ce49d5695cd9982ea91fb0150f720e029ef9612f0a342}"
    ports:
      - "127.0.0.1:3022:3022"
    volumes:
      - exports:/exports:ro
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3022/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  mcp-spice:
    image: "${MCP_SPICE_IMAGE:-ghcr.io/casys-ai/mcp-spice@sha256:80f8d6b34dc55e623daf936faea5ff9ee75871331aa88d7339191ea17584991b}"
    ports:
      - "127.0.0.1:3023:3023"
    volumes:
      - exports:/exports:ro
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3023/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

networks:
  chain:
  erpnext:
    external: true
    name: "${ERPNEXT_DOCKER_NETWORK:-erpnext-docker_frappe_network}"

volumes:
  build123d-sandbox-exports:
  syson-db-data:
  exports:
