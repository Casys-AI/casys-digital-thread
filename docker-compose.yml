# The full verification chain, one command:
#   docker compose up -d
#
# Services:
#   syson-db / syson-app   SysON (SysML v2 modeler) on http://localhost:8180
#   mcp-syson              MCP over HTTP on http://localhost:3009
#   mcp-build123d          MCP over HTTP on http://localhost:3014
#   mcp-calculix           MCP over HTTP on http://localhost:3015
#   mcp-modelica           MCP over HTTP on http://localhost:3016
#   mcp-erpnext            MCP over HTTP on http://localhost:3012
#
# The MCP servers bind 0.0.0.0 INSIDE their containers (required to be
# reachable through the port mapping); the mapping itself is loopback-only,
# so nothing is exposed beyond this machine.
#
# build123d and calculix share the /exports volume: a STEP exported by
# build123d_export is immediately readable by calculix_solve_static at
# /exports/<name>.step.
#
services:
  syson-db:
    image: postgres:15
    environment:
      POSTGRES_DB: syson
      POSTGRES_USER: syson
      POSTGRES_PASSWORD: syson
    volumes:
      - syson-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syson -d syson"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [chain]

  syson-app:
    # SysON is amd64-only. Make the architecture explicit so
    # Docker Desktop/Colima emulates it on Apple Silicon.
    platform: linux/amd64
    image: "${SYSON_IMAGE:-eclipsesyson/syson:v2026.7.0}"
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://syson-db/syson
      SPRING_DATASOURCE_USERNAME: syson
      SPRING_DATASOURCE_PASSWORD: syson
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
      # Elasticsearch is an experimental, opt-in SysON integration. It is not
      # part of this topology, so do not let its default localhost probe turn
      # the otherwise ready SysON service into a false-negative health state.
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
    depends_on:
      syson-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      # SysON loads its standard libraries at boot; under amd64 emulation this
      # took 217 seconds in the integration check.
      start_period: 240s
    networks: [chain]

  mcp-syson:
    # Keep the SysON sidecar independently selectable for a locally verified
    # protocol fix. This avoids replacing it with the shared toolchain image
    # when Compose is started for build123d or CalculiX.
    image: "${MCP_SYSON_IMAGE:-ghcr.io/casys-ai/engineering-toolchain@sha256:706b2099f947ff3c44c9a532d9da6d96e4312b3cdc879185e37e8d1ac99e1f01}"
    command: ["syson", "--port=3009", "--hostname=0.0.0.0"]
    environment:
      SYSON_URL: http://syson-app:8080
    ports:
      - "127.0.0.1:3009:3009"
    depends_on:
      syson-app:
        condition: service_healthy
    networks: [chain]

  mcp-build123d:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain@sha256:706b2099f947ff3c44c9a532d9da6d96e4312b3cdc879185e37e8d1ac99e1f01}"
    command: ["build123d", "--port=3014", "--hostname=0.0.0.0"]
    ports:
      - "127.0.0.1:3014:3014"
    volumes:
      - exports:/exports
    networks: [chain]

  mcp-calculix:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain@sha256:706b2099f947ff3c44c9a532d9da6d96e4312b3cdc879185e37e8d1ac99e1f01}"
    command: ["calculix", "--port=3015", "--hostname=0.0.0.0"]
    ports:
      - "127.0.0.1:3015:3015"
    volumes:
      - exports:/exports
    networks: [chain]

  # This image is intentionally independent from engineering-toolchain: OMC
  # and MSL have a separate release, verification path, and evidence volume.
  mcp-modelica:
    # MCP_MODELICA_IMAGE lets a locally verified sidecar be tested without
    # spending a GitHub Actions image build. The committed default stays pinned.
    image: "${MCP_MODELICA_IMAGE:-ghcr.io/casys-ai/mcp-modelica@sha256:a044998655a7299466ce1c32fd6f17994096c2cdaaf980f29a6fc4f0102d38d3}"
    ports:
      - "127.0.0.1:3016:3016"
    volumes:
      - modelica-runs:/runs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3016/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  # Until the mcp-server 0.24 base is reviewed and released by mcp-erpnext, the
  # local tag combines base 17ca098 with viewer/UOM fix 1d99467. Build only from
  # that exact clean commit (MCP_ERPNEXT_CONTEXT can select another worktree).
  # The ERP API remains on its own network; only this MCP bridge joins both.
  mcp-erpnext:
    build:
      context: "${MCP_ERPNEXT_CONTEXT:-../mcp-erpnext}"
    image: "${MCP_ERPNEXT_IMAGE:-casys-digital-thread/mcp-erpnext:3.0.0-17ca098-1d99467}"
    command:
      [
        "run",
        "--allow-all",
        "server.ts",
        "--http",
        "--port=3012",
        "--hostname=0.0.0.0",
        "--categories=manufacturing,inventory,operations",
      ]
    env_file:
      - path: "${ERPNEXT_ENV_FILE:-../mcp-erpnext/.env}"
        required: false
    environment:
      # Container DNS is preferable to routing API credentials through a host
      # port. Override only when the ERPNext stack uses another service name.
      ERPNEXT_URL: "${ERPNEXT_UPSTREAM_URL:-http://frontend:8080}"
    ports:
      - "127.0.0.1:3012:3012"
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3012/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain, erpnext]

  # The four standalone oracle servers, each pinned to its published ghcr
  # image. Their entrypoints default to HTTP mode binding 0.0.0.0 inside the
  # container on their park port; the mappings stay loopback-only. dfm,
  # prusaslicer and spice mount /exports read-only: they verify artifacts the
  # chain produced (or dropped) there — they never write into it.
  mcp-dfm:
    image: "${MCP_DFM_IMAGE:-ghcr.io/casys-ai/mcp-dfm@sha256:b0013717a77712bab741ec1ec54c10f74b09ac66ad66f988e33d96ca660d93a6}"
    ports:
      - "127.0.0.1:3018:3018"
    volumes:
      - exports:/exports:ro
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3018/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  mcp-tolerance:
    image: "${MCP_TOLERANCE_IMAGE:-ghcr.io/casys-ai/mcp-tolerance@sha256:0a45eaade244bfb4beb0c179bd42efb0aabe9ec1de20edaff1fc1b069b03f323}"
    ports:
      - "127.0.0.1:3019:3019"
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3019/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  mcp-prusaslicer:
    image: "${MCP_PRUSASLICER_IMAGE:-ghcr.io/casys-ai/mcp-prusaslicer@sha256:6d55cb3d8c62d1f0372fa65a772a5f6941b7175c49881dfaba168cb1a3389975}"
    ports:
      - "127.0.0.1:3022:3022"
    volumes:
      - exports:/exports:ro
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3022/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

  mcp-spice:
    image: "${MCP_SPICE_IMAGE:-ghcr.io/casys-ai/mcp-spice@sha256:cabf9a87e2006811484625f833859b96724faaf5dab6d60f1a10dc7cc6777a69}"
    ports:
      - "127.0.0.1:3023:3023"
    volumes:
      - exports:/exports:ro
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const response = await fetch('http://127.0.0.1:3023/health'); if (!response.ok) Deno.exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

networks:
  chain:
  erpnext:
    external: true
    name: "${ERPNEXT_DOCKER_NETWORK:-erpnext-docker_frappe_network}"

volumes:
  syson-db-data:
  exports:
  # An explicit Docker name preserves immutable Modelica run records across
  # Compose restarts for modelica_run_get. An opt-in local integration run may
  # set MODELICA_RUNS_VOLUME to a fresh name instead of deleting retained
  # evidence from the default volume.
  modelica-runs:
    name: "${MODELICA_RUNS_VOLUME:-casys-digital-thread-modelica-runs}"
