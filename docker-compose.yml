# The full verification chain, one command:
#   docker compose up -d
#
# Services:
#   syson-db / syson-app   SysON (SysML v2 modeler) on http://localhost:8180
#   mcp-syson              MCP over HTTP on http://localhost:3009
#   mcp-build123d          MCP over HTTP on http://localhost:3014
#   mcp-calculix           MCP over HTTP on http://localhost:3015
#   mcp-modelica           MCP over HTTP on http://localhost:3016
#
# The MCP servers bind 0.0.0.0 INSIDE their containers (required to be
# reachable through the port mapping); the mapping itself is loopback-only,
# so nothing is exposed beyond this machine.
#
# build123d and calculix share the /exports volume: a STEP exported by
# build123d_export is immediately readable by calculix_solve_static at
# /exports/<name>.step.
#
services:
  syson-db:
    image: postgres:15
    environment:
      POSTGRES_DB: syson
      POSTGRES_USER: syson
      POSTGRES_PASSWORD: syson
    volumes:
      - syson-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syson -d syson"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [chain]

  syson-app:
    # SysON and the engineering-toolchain image are amd64-only. Make the
    # architecture explicit so Docker Desktop/Colima emulates on Apple Silicon.
    platform: linux/amd64
    image: "${SYSON_IMAGE:-eclipsesyson/syson:v2026.7.0}"
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://syson-db/syson
      SPRING_DATASOURCE_USERNAME: syson
      SPRING_DATASOURCE_PASSWORD: syson
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
      # Elasticsearch is an experimental, opt-in SysON integration. It is not
      # part of this topology, so do not let its default localhost probe turn
      # the otherwise ready SysON service into a false-negative health state.
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
    depends_on:
      syson-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      # SysON loads its standard libraries at boot; under amd64 emulation this
      # took 217 seconds in the integration check.
      start_period: 240s
    networks: [chain]

  mcp-syson:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain@sha256:875362406aedf003fef36ee28e170dbe24912f41d8752feeaba0c1cb134e6084}"
    platform: linux/amd64
    command: ["syson", "--port=3009", "--hostname=0.0.0.0"]
    environment:
      SYSON_URL: http://syson-app:8080
    ports:
      - "127.0.0.1:3009:3009"
    depends_on:
      syson-app:
        condition: service_healthy
    networks: [chain]

  mcp-build123d:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain@sha256:875362406aedf003fef36ee28e170dbe24912f41d8752feeaba0c1cb134e6084}"
    platform: linux/amd64
    command: ["build123d", "--port=3014", "--hostname=0.0.0.0"]
    ports:
      - "127.0.0.1:3014:3014"
    volumes:
      - exports:/exports
    networks: [chain]

  mcp-calculix:
    image: "${TOOLCHAIN_IMAGE:-ghcr.io/casys-ai/engineering-toolchain@sha256:875362406aedf003fef36ee28e170dbe24912f41d8752feeaba0c1cb134e6084}"
    platform: linux/amd64
    command: ["calculix", "--port=3015", "--hostname=0.0.0.0"]
    ports:
      - "127.0.0.1:3015:3015"
    volumes:
      - exports:/exports
    networks: [chain]

  # This image is intentionally independent from engineering-toolchain: OMC
  # and MSL have a separate release, verification path, and evidence volume.
  mcp-modelica:
    # MCP_MODELICA_IMAGE lets a locally verified sidecar be tested without
    # spending a GitHub Actions image build. The committed default stays pinned.
    image: "${MCP_MODELICA_IMAGE:-ghcr.io/casys-ai/mcp-modelica@sha256:c25462461a7aa4191e0a22c2275788fe03dad817532ab755f5cb45ad7d7c7149}"
    ports:
      - "127.0.0.1:3016:3016"
    volumes:
      - modelica-runs:/runs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3016/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [chain]

networks:
  chain:

volumes:
  syson-db-data:
  exports:
  # An explicit Docker name preserves immutable Modelica run records across
  # Compose restarts for modelica_run_get.
  modelica-runs:
    name: casys-digital-thread-modelica-runs
