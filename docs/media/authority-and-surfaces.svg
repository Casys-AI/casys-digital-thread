<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Authority split and surfaces</title>
  <desc id="d">Human confirms in chat. Agent proposes registered operations. Server owns sequences. Workbench is read-only.</desc>
  <rect width="960" height="540" fill="#f6f1e8"/>
  <text x="32" y="40" font-family="Georgia, serif" font-size="22" fill="#1c1914">Casys Digital Thread — who may do what</text>
  <text x="32" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c564c">Analysis is never authority. A preview, draft, or graph edge does not authorize dispatch.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="32" y="92" width="210" height="150" rx="8" fill="#fff" stroke="#c9bfae"/>
    <text x="48" y="118" font-size="14" font-weight="700" fill="#8a3b12">HUMAN</text>
    <text x="48" y="142" font-size="13" fill="#1c1914">Intent + signed MRTR</text>
    <text x="48" y="162" font-size="12" fill="#5c564c">brief / decision / cancel</text>
    <text x="48" y="190" font-size="12" fill="#8a3b12">must not author</text>
    <text x="48" y="208" font-size="12" fill="#5c564c">solver decks or envelopes</text>

    <rect x="262" y="92" width="210" height="150" rx="8" fill="#fff" stroke="#c9bfae"/>
    <text x="278" y="118" font-size="14" font-weight="700" fill="#1c4d3a">AGENT</text>
    <text x="278" y="142" font-size="13" fill="#1c1914">Propose · plan · queue</text>
    <text x="278" y="162" font-size="12" fill="#5c564c">execute registered ops only</text>
    <text x="278" y="190" font-size="12" fill="#8a3b12">must not choose</text>
    <text x="278" y="208" font-size="12" fill="#5c564c">provider, tool, path, plan JSON</text>

    <rect x="492" y="92" width="210" height="150" rx="8" fill="#fff" stroke="#c9bfae"/>
    <text x="508" y="118" font-size="14" font-weight="700" fill="#1c3558">SERVER</text>
    <text x="508" y="142" font-size="13" fill="#1c1914">Sequences · parsers</text>
    <text x="508" y="162" font-size="12" fill="#5c564c">profiles · CAS · WAL · lowering</text>
    <text x="508" y="190" font-size="12" fill="#8a3b12">must not accept</text>
    <text x="508" y="208" font-size="12" fill="#5c564c">latest, labels as join keys</text>

    <rect x="722" y="92" width="206" height="150" rx="8" fill="#fff" stroke="#c9bfae"/>
    <text x="738" y="118" font-size="14" font-weight="700" fill="#5c564c">WORKBENCH</text>
    <text x="738" y="142" font-size="13" fill="#1c1914">GET + SSE only</text>
    <text x="738" y="162" font-size="12" fill="#5c564c">five spaces, no commands</text>
    <text x="738" y="190" font-size="12" fill="#8a3b12">must not receive</text>
    <text x="738" y="208" font-size="12" fill="#5c564c">MCP authority or secrets</text>
  </g>

  <path d="M137 242 v28 H480 v20" fill="none" stroke="#8a3b12" stroke-width="1.5"/>
  <path d="M367 242 v28" fill="none" stroke="#1c4d3a" stroke-width="1.5"/>
  <path d="M597 242 v48" fill="none" stroke="#1c3558" stroke-width="1.5"/>
  <path d="M825 242 v28 H480 v20" fill="none" stroke="#5c564c" stroke-width="1.5"/>

  <rect x="300" y="290" width="360" height="56" rx="8" fill="#1c1914"/>
  <text x="480" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f6f1e8">Digital Thread MCP :3020</text>
  <text x="480" y="334" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c9bfae">immutable project + thread revisions</text>

  <path d="M480 346 v28" fill="none" stroke="#1c1914" stroke-width="1.5"/>

  <rect x="80" y="386" width="380" height="120" rx="8" fill="#fff" stroke="#c9bfae"/>
  <text x="96" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1914">Private provider MCP</text>
  <text x="96" y="434" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c564c">SysON · CalculiX · Modelica · ERP · sandbox CAD</text>
  <text x="96" y="456" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c564c">never a second agent tool surface</text>
  <text x="96" y="484" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8a3b12">hashed resources /read → CAS</text>

  <rect x="500" y="386" width="380" height="120" rx="8" fill="#fff" stroke="#c9bfae"/>
  <text x="516" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1914">Local microVM (qualified only)</text>
  <text x="516" y="434" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c564c">Build123d · Modelica kit · CalculiX @3</text>
  <text x="516" y="456" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c564c">independent qualification, not a fallback</text>
  <text x="516" y="484" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8a3b12">do not reroute @2 plans here</text>
</svg>
