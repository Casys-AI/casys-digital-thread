    </div>
  );
}

/* ═══ shell ═══ */
const VIEWS = {
  overview: Overview, work: Work, structure: ProductStructure,
  requirements: ProductRequirements, sourcing: ProductSourcing,
  verification: Verification, operations: Operations,
};

function NavIcon({ paths, active }) {
  return (
    <svg viewBox="0 0 16 16" class={'size-[15px] ' + (active ? '' : 'opacity-70')} fill="none" stroke={active ? '#0e7490' : 'currentColor'} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
      {paths.map((d) => <path key={d} d={d} />)}
    </svg>
  );
}

function App() {
  const [view, setView] = useState('overview');
  const [brief, setBrief] = useState(false);
  const productOpen = ['structure', 'requirements', 'sourcing'].includes(view);
  const Current = VIEWS[view];

  return (
    <div class="mx-auto w-[1400px] overflow-hidden rounded-lg border border-zinc-200 bg-white">
      <header class="flex h-11 items-center gap-3 border-b border-zinc-200 px-4">
        <span class="grid size-[22px] place-items-center rounded-md bg-accent text-[9.5px] font-bold text-white">DT</span>
        <span class="text-[13px] font-semibold -tracking-[.01em]">Casys</span>
        <span class="h-[15px] w-px bg-zinc-200" />
        <span class="text-[13px] font-medium">AV-114 payload bracket — 9 g proof</span>
        {brief ? <span class="inline-flex items-center rounded-md bg-lane-phys/10 px-1.5 py-px text-[11px] font-medium text-lane-phys">Framing</span> : null}
        <div class="ml-auto flex items-center gap-4 text-[11.5px] text-zinc-500">
          <span class="flex items-center gap-1.5"><i class="size-1.5 rounded-full bg-lane-verdict" /><strong class="font-medium text-zinc-700">Live</strong></span>
          <span>Thread <strong class="font-mono text-[11px] font-medium text-zinc-900">thr-9f2c</strong></span>
          <span class="flex items-center gap-1.5">Snapshot <SnapshotSelect /></span>
          <ProjectMenu onBrief={() => setBrief(true)} />
        </div>
      </header>

      {brief ? <Briefing onBack={() => setBrief(false)} /> : (
        <div class="flex items-stretch">
          <nav class="flex w-[196px] shrink-0 flex-col gap-0.5 border-r border-zinc-200 px-2.5 py-3">
            {NAV.map((n) => {
              const active = view === n.id || (n.kids && productOpen);
              if (!n.kids) return (
                <button key={n.id} type="button" onClick={() => setView(n.id)}
                  class={'flex h-[29px] items-center gap-2.5 rounded-md px-2.5 text-[12.5px] font-medium ' + (view === n.id ? 'bg-accent/8 text-accent-strong' : 'text-zinc-500 hover:bg-zinc-100')}>
                  <NavIcon paths={n.paths} active={view === n.id} />{n.name}
                </button>
              );
              return (
                <Collapsible.Root key={n.id} open={productOpen} onOpenChange={(e) => setView(e.open ? 'structure' : 'overview')}>
                  <Collapsible.Trigger class={'flex h-[29px] w-full items-center gap-2.5 rounded-md px-2.5 text-[12.5px] font-medium ' + (active ? 'bg-accent/8 text-accent-strong' : 'text-zinc-500 hover:bg-zinc-100')}>
                    <NavIcon paths={n.paths} active={active} />{n.name}
                  </Collapsible.Trigger>
                  <Collapsible.Content class="overflow-hidden data-[state=closed]:hidden">
                    <div class="my-px ml-[17px] flex flex-col gap-px border-l border-zinc-200 pl-2.5">
                      {n.kids.map((k) => (
                        <button key={k.id} type="button" onClick={() => setView(k.id)}
                          class={'flex h-[25px] items-center justify-between rounded-md px-2 text-[11.5px] ' + (view === k.id ? 'bg-zinc-100 font-medium text-zinc-900' : (k.muted ? 'text-zinc-400' : 'text-zinc-500') + ' hover:bg-zinc-100')}>
                          {k.name}{k.tag ? <span class={'font-mono text-[9px] font-medium ' + k.tagTone}>{k.tag}</span> : null}
                        </button>
                      ))}
                    </div>
                  </Collapsible.Content>
                </Collapsible.Root>
              );
            })}
          </nav>
          <main class="min-w-0 flex-1 bg-zinc-100 px-6 pt-4.5 pb-7"><Current /></main>
        </div>
      )}

      <footer class="flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-zinc-200 bg-zinc-50 px-4 py-2 font-mono text-[10px] text-zinc-500">
        <span class="font-semibold tracking-[.08em] text-zinc-900">ARK UI SUR PREACT</span>
        <span>Collapsible → sous-menu Product</span><span>TreeView → structure SysML</span><span>Splitter → viewer/rail</span>
        <span>Accordion → ligne de matrice</span><span>Dialog → MRTR</span><span>Select · Menu · Tooltip · Progress · Toast</span>
        <span class="ml-auto">preact 10 + preact/compat · tailwind 4 @theme · état via data-*</span>
      </footer>
    </div>
  );
}

const Toasts = () => (
  <Toaster toaster={toaster}>
    {(toast) => (
      <Toast.Root class="flex w-[300px] items-start gap-2.5 rounded-md border border-zinc-200 bg-white px-3 py-2.5 shadow-lg">
        <i class="mt-1 size-1.5 shrink-0 rounded-full bg-lane-verdict" />
        <div class="min-w-0">
          <Toast.Title class="text-[11.5px] font-medium text-zinc-900">{toast.title}</Toast.Title>
          <Toast.Description class="mt-0.5 font-mono text-[10px] text-zinc-500">{toast.description}</Toast.Description>
        </div>
        <Toast.CloseTrigger class="ml-auto font-mono text-[10.5px] font-medium text-accent">Inspect</Toast.CloseTrigger>
      </Toast.Root>
    )}
  </Toaster>
);

createRoot(document.getElementById('root')).render(<React.StrictMode><App /><Toasts /></React.StrictMode>);
</script>
</body>
</html>
