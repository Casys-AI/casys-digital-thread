function Hint({ children, label }) {

    <Tooltip.Root openDelay={120} closeDelay={60} positioning={{ placement: 'top' }}>

      <Portal>

            {label}

        </Tooltip.Positioner>
      </Portal>
    </Tooltip.Root>
  );
}

function VerdictTile({ v }) {
  const barTone = v.tone === 'warn' ? 'bg-lane-phys' : 'bg-lane-verdict';
  const textTone = v.tone === 'warn' ? 'text-lane-phys' : v.tone === 'run' ? 'text-accent' : 'text-lane-verdict';
  const running = v.state === 'RUNNING';
  return (
    <div class={'rounded-lg px-3 py-2.5 ' + (running ? 'border border-dashed border-accent/50 bg-accent/3' : 'border border-zinc-200 bg-white shadow-xs')}>
      <div class="flex items-center justify-between">
        <span class="font-mono text-[10px] font-medium text-accent">{v.req}</span>
        <span class={'rounded-md px-1.5 py-px font-mono text-[9px] font-semibold tracking-[.06em] ' + (running ? 'bg-accent/12 text-accent' : 'bg-lane-verdict/10 text-lane-verdict')}>{v.state}</span>
      </div>
      <p class="mt-1.5 text-xs font-medium">{v.title}</p>
      <Progress.Root value={v.pct} min={0} max={100} class="mt-0.5 block">
        <Progress.ValueText asChild>
          <p class="font-mono text-xs font-medium text-zinc-700">{v.value} <span class="text-zinc-400">{v.limit}</span></p>
        </Progress.ValueText>
        <Progress.Track class="mt-1.5 h-1 overflow-hidden rounded-full bg-zinc-200">
          {v.pct === null
            ? <div class="h-full w-full bg-[repeating-linear-gradient(90deg,rgba(14,116,144,.35)_0_6px,transparent_6px_12px)]" />
            : <Progress.Range class={'h-full rounded-full ' + barTone} />}
        </Progress.Track>
      </Progress.Root>
      <Hint label={v.tip}>
        <button type="button" class={'mt-1.5 block w-full cursor-help text-right font-mono text-[10px] font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent ' + textTone}>{v.margin}</button>
      </Hint>
    </div>
  );
}

              <h1 class="mt-1 max-w-[620px] text-[19px]/tight font-semibold -tracking-[.015em] text-balance">Hold a 4 kg payload through 9 g maneuvers without yield</h1>
            </div>
            <dl class="grid shrink-0 grid-cols-3 overflow-hidden rounded-lg border border-zinc-200 bg-white">
              {[
                ['STATUS', <span class="flex items-center gap-1.5"><i class="size-1.5 shrink-0 rounded-full bg-lane-verdict" />Active — physics</span>],
                ['VERDICTS', <span class="font-mono"><span class="text-lane-verdict">9 PASS</span> · 2 RUN · 1 —</span>],
                ['SNAPSHOT', <span class="font-mono">@47</span>],
              ].map(([k, v], i) => (
                <div key={k} class={'px-3 py-1.5 ' + (i ? 'border-l border-zinc-200' : '')}>
                  <dt class="font-mono text-[9px] font-medium tracking-[.08em] text-zinc-500">{k}</dt>
                  <dd class="mt-px text-[12.5px] font-medium text-zinc-900">{v}</dd>
                </div>
              ))}
            </dl>
          </div>

          <ReviewBanner />

          <section class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-xs">
            <GateBand />
            <div class="grid grid-cols-5 border-b border-zinc-100">
              {lanes.map((l, i) => (
                <div key={l.label} class={'px-4 pt-2 pb-1.5 ' + (i ? 'border-l border-dashed border-zinc-200' : '')}>
                  <p class={'font-mono text-[9.5px] font-semibold tracking-[.1em] ' + l.color}>{l.label}</p>
                  <p class="mt-px font-mono text-[9.5px] text-zinc-400">{l.sub}</p>
                </div>
              ))}
            </div>
            <div dangerouslySetInnerHTML={{ __html: graphSvg }} />
          </section>

          <div class="mt-3.5 grid grid-cols-5 gap-2.5">
            {verdicts.map((v) => <VerdictTile key={v.req} v={v} />)}
          </div>

          <div class="mt-3.5 grid grid-cols-[minmax(0,1fr)_340px] items-start gap-3.5">
            <section class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-xs">
              <div class="flex items-center justify-between border-b border-zinc-200 px-3.5 py-2">
                <span class={label}>NOW</span>
                <span class="flex items-center gap-1.5 font-mono text-[9.5px] text-accent"><i class="size-[5px] rounded-full bg-accent" />1 RUN LIVE</span>
              </div>
              <div class="py-1">
                {feed.map((f) => (
                  <div key={f.t} class="grid grid-cols-[42px_14px_minmax(0,1fr)_auto] gap-x-2 px-3.5 py-1.5">
                    <span class="pt-px font-mono text-[10.5px] text-zinc-500">{f.t}</span>
                    <span class={'font-mono text-[10.5px] font-medium ' + f.tone}>{f.mark}</span>
                    <span class={'text-xs ' + (f.live ? 'text-zinc-900' : 'text-zinc-700')}>{f.text}</span>
                    <span class="font-mono text-[10px] text-zinc-500">{f.who}</span>
                  </div>
                ))}
              </div>
              <div class="border-t border-zinc-200 bg-zinc-50 px-3.5 py-2">
                <button type="button" class="text-[11.5px] font-medium text-accent hover:text-accent-strong">Open activity →</button>
              </div>
            </section>

            <section class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-xs">
              <div class="flex items-center justify-between border-b border-zinc-200 px-3 py-2.5">
                <span class={label}>SEALED ASSEMBLY · REV C</span>
                <span class="font-mono text-[9.5px] text-zinc-400">STEP → GLB</span>
              </div>
              <div class="grid h-[158px] place-items-center bg-[repeating-linear-gradient(45deg,#f4f4f5_0_8px,#fafafa_8px_16px)]">
                <span class="text-center font-mono text-[10px] text-zinc-400">sealed-assembly-revC.glb<br />orbit viewport</span>
              </div>
              <div class="flex justify-between border-t border-zinc-200 bg-zinc-50 px-3 py-2 font-mono text-[10px] text-zinc-500">
                <span>168.4 g exact</span><span>4 parts</span><span>96×64×38 mm</span>
              </div>
            </section>
          </div>

          <p class="mt-4 font-mono text-[10px] text-zinc-400">
            proj-av114@47 · thr-9f2c · subj-bracket-a3 &nbsp;—&nbsp;
            {' '}<a href="#" class="text-accent hover:text-accent-strong">Product</a> · <a href="#" class="text-accent hover:text-accent-strong">Evidence</a> · <a href="#" class="text-accent hover:text-accent-strong">Activity</a>
          </p>
        </main>
      </div>

      <footer class="flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-zinc-200 bg-zinc-50 px-4 py-2 font-mono text-[10px] text-zinc-500">
        <span class="font-semibold tracking-[.08em] text-zinc-900">ARK UI SUR PREACT — CÂBLÉ SUR CETTE PAGE</span>
        <span>Select → snapshot</span><span>Menu → actions projet</span><span>Dialog → décision MRTR</span>
        <span>Tooltip → marges</span><span>Progress → gauges</span><span>Toast → décision signée</span>
        <span class="ml-auto">preact 10 + preact/compat · tailwind 4 @theme · état via data-*</span>
      </footer>
    </div>
  );
}

const Toasts = () => (
  <Toaster toaster={toaster}>
    {(toast) => (
      <Toast.Root class="flex w-[300px] items-start gap-2.5 rounded-md border border-zinc-200 bg-white px-3 py-2.5 shadow-lg">
        <i class="mt-1 size-1.5 shrink-0 rounded-full bg-lane-verdict" />
        <div class="min-w-0">
          <Toast.Title class="text-[11.5px] font-medium text-zinc-900">{toast.title}</Toast.Title>
          <Toast.Description class="mt-0.5 font-mono text-[10px] text-zinc-500">{toast.description}</Toast.Description>
        </div>
        <Toast.CloseTrigger class="ml-auto font-mono text-[10.5px] font-medium text-accent">Inspect</Toast.CloseTrigger>
      </Toast.Root>
    )}
  </Toaster>
);

createRoot(document.getElementById('root')).render(
  <React.StrictMode><App /><Toasts /></React.StrictMode>
);
</script>
</body>
</html>
